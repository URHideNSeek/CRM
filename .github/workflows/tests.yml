name: CRM checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: test_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://crm:test_only_password@localhost:5432/crm_test
      TEST_DATABASE_URL: postgresql+psycopg://crm:test_only_password@localhost:5432/crm_test
      AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
      - name: Build deployment image
        run: docker build -t ur-crm-ci .
      - name: Check container worker and app
        run: |
          docker run --rm --network host -e DATABASE_URL -e AUTH_MODE --entrypoint python ur-crm-ci -m crm.reminders
          docker run -d --name crm-smoke --network host -e DATABASE_URL -e AUTH_MODE ur-crm-ci
          trap 'docker rm -f crm-smoke' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          docker logs crm-smoke
          exit 1
