services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD}@db:5432/crm
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD}@db:5432/crm
      AUTH_MODE: ${AUTH_MODE:-local}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    # For OIDC, mount .streamlit/secrets.toml into /app/.streamlit/secrets.toml (read-only).
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  reminders:
    build: .
    command: ["python", "-m", "crm.reminders", "--loop"]
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD}@db:5432/crm
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  crm_data:
